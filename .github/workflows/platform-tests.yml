name: Windows and macOS tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install optional plot dependencies used by tests
        run: python -m pip install -r piezocatalysis-lca-modeling/assets/examples/synthetic-plotting/requirements.txt
      - name: Run synthetic and unit tests
        run: python -m unittest discover -s tests
